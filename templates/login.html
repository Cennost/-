<!DOCTYPE html>
<html>
<head>
    <title>Вход в дневник</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: #fefcf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 35px 40px 40px 40px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #f0ebe6;
        }
        .login-header {
            text-align: center;
            border-bottom: 3px solid #4a2c1a;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .login-header img {
            height: 90px;
            width: auto;
            border-radius: 12px;
            display: block;
            margin: 0 auto 12px;
        }
        .login-header h1 {
            font-size: 30px;
            font-weight: 900;
            color: #4a2c1a;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1.2;
        }
        .login-header p {
            font-size: 15px;
            color: #7f8c8d;
            margin: 5px 0 0 0;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .login-card h2 {
            text-align: center;
            color: #2c3e50;
            font-weight: 400;
            font-size: 22px;
            margin: 0 0 25px 0;
        }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eee;
            border-radius: 50px;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: border 0.3s, box-shadow 0.3s;
            background: #fafafa;
        }
        .login-card input:focus {
            border-color: #4a2c1a;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(74, 44, 26, 0.08);
        }
        .login-card .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: 2px solid #145a2b;
            border-radius: 50px;
            background: #145a2b;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(20, 90, 43, 0.3);
            margin-top: 5px;
        }
        .login-card .btn-login:hover {
            background: #eaf5ed;
            border-color: #145a2b;
            color: #145a2b;
            box-shadow: 0 6px 20px rgba(20, 90, 43, 0.4);
        }
        .login-card .error {
            margin-top: 15px;
            text-align: center;
            background: #fadbd8;
            color: #922b21;
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid #f5b7b1;
            font-size: 14px;
        }
        .login-card .container {
            padding: 0;
            box-shadow: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <img src="/static/logo.jpg" alt="ЦЕННОСТЬ">
            <h1>ЦЕННОСТЬ</h1>
            <p>Электронный дневник</p>
        </div>

        <h2>Вход в систему</h2>

        <form method="POST">
            <input type="text" name="username" placeholder="Логин" required autocapitalize="none" autocorrect="off" spellcheck="false">
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit" class="btn-login">Войти</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>

</body>
</html>
