# Blueprint для Render: создаёт веб-сервис и базу PostgreSQL одним нажатием
databases:
  - name: diary-db
    plan: free
    databaseName: diary
    user: diary

services:
  - type: web
    name: diary
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: diary-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_PASSWORD
        sync: false   # Render спросит пароль учителя при создании
